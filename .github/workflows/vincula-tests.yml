name: Vincula — testes de integridade
on:
  push:
    branches:
      - main
      - fix/ld-status-purpose-20261027
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Suíte existente
        run: node tests/run.js
      - name: Regressão de STATUS da LD
        run: node tests/ld-status.js
