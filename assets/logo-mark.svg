<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="vinculaMarkTitle">
  <title id="vinculaMarkTitle">Vincula</title>
  <defs>
    <linearGradient id="vinculaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12457c"/>
      <stop offset="1" stop-color="#061b34"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#vinculaBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  <!-- Duas hastes que se encontram: dois documentos vinculados em um ponto. -->
  <path d="M15.5 14 L31.5 37.5" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <path d="M48.5 14 L32.5 37.5" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <!-- O pino: o ponto exato onde os dois registros se ligam. -->
  <rect x="25.7" y="31.7" width="12.6" height="12.6" rx="3.4" transform="rotate(45 32 38)" fill="#ef8b2c"/>
  <!-- Barra base: a linha do registro atualizado. -->
  <rect x="21" y="50" width="22" height="5" rx="2.5" fill="#ef8b2c"/>
</svg>
